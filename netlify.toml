[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "prototypes/cloudtop-hotel/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/prototypes/sushi-loop/design/underwater-art-preview"
  to = "/prototypes/sushi-loop/design/underwater-map-designer/"
  status = 302

[[redirects]]
  from = "/prototypes/sushi-loop/design/underwater-art-preview/*"
  to = "/prototypes/sushi-loop/design/underwater-map-designer/"
  status = 302

[[redirects]]
  from = "/prototypes/sushi-loop/design/expedition-preview"
  to = "/prototypes/sushi-loop/design/underwater-map-designer/"
  status = 302

[[redirects]]
  from = "/prototypes/sushi-loop/design/expedition-preview/*"
  to = "/prototypes/sushi-loop/design/underwater-map-designer/"
  status = 302
