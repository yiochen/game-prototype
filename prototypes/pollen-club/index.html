<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#f5efdf"><meta name="description" content="Tiny bee golf in a bouncy garden. Pull, release, and wake every flower."><title>Pollen Club · The Playground</title></head>
<body>
  <header><a class="icon-button home" href="../../" aria-label="Back to the playground">⌂</a><span class="wordmark"><span class="brand-dot"></span> THE PLAYGROUND</span><nav><button id="sound" class="icon-button" aria-label="Turn sound on" aria-pressed="false">♪</button><button id="help" class="icon-button" aria-label="Pause and open help">?</button></nav></header>
  <main>
    <aside class="side"><div class="hero"><p class="eyebrow">01 / A LITTLE PHYSICS</p><h1>Pollen<br><i>Club.</i></h1><p class="tagline">A tiny bee.<br>A big bloom.</p></div><div class="stats"><span class="stat-icon">✿</span><strong id="blooms">0 / 3</strong><span class="stat-caption">awake</span></div><div class="chapter"><span id="chapter-label" class="eyebrow">GARDEN 01 / 05</span><h2 id="garden-name">Good morning</h2><div id="garden-dots" class="chapter-dots" aria-label="Choose a garden"></div></div><div class="small-stat"><span>Flights</span><strong id="shots">0</strong><span id="par">par 3</span></div></aside>
