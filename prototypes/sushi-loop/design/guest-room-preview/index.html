<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#efe9dd">
<title>Sushi Loop · Guest room</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<div id="app">
  <header class="hud">
    <div class="coins" aria-label="Coins"><i class="coin"></i><output id="coins">0</output></div>
    <div id="rate" class="rate" aria-label="Coins a minute"></div>
    <span class="grow"></span>
    <button id="cheat" class="icon wide" aria-label="Cheat: add 10,000 coins">+10k</button>
    <button id="speed" class="icon wide" aria-label="Game speed" aria-pressed="false">×1</button>
    <button id="reset" class="icon" aria-label="Start over">↺</button>
  </header>
  <section class="stats" aria-label="Room">
    <div><small>Appeal</small><b id="appeal"></b></div>
    <div><small>Theme</small><b id="theme"></b></div>
    <div><small>Guests</small><b id="inside"></b></div>
    <div><small>Traffic</small><b id="traffic"></b></div>
  </section>
  <p id="flow" aria-live="polite"></p>
  <main>
    <canvas id="board" aria-label="Guest room floor"></canvas>
    <div id="banner" aria-live="polite"></div>
  </main>
  <footer class="dock">
    <div id="sel" class="sel"></div>
    <div class="row">
      <div class="styles" role="radiogroup" aria-label="Style for new pieces" id="styles"></div>
      <button id="cap" class="up"></button>
      <button id="kit" class="up"></button>
    </div>
    <div class="parts" id="parts" role="toolbar" aria-label="Pieces"></div>
  </footer>
</div>
<script type="module" src="./app.js"></script>
</body>
</html>
