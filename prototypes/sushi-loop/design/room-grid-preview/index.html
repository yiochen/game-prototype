<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#efe9dd">
<title>Sushi Loop · Room grid</title>
  <script type="module" crossorigin src="../../../../assets/sushi-loop/design/room-grid-preview-BFRXDgFi.js"></script>
  <link rel="modulepreload" crossorigin href="../../../../assets/modulepreload-polyfill-B5Qt9EMX.js">
  <link rel="stylesheet" crossorigin href="../../../../assets/room-grid-preview-BMfL2yZY.css">
</head>
<body>
<div id="app">
  <header class="hud">
    <div class="coins" aria-label="Coins"><i class="coin"></i><output id="coins">0</output></div>
    <div class="salv" aria-label="Salvage">🔩<output id="salvage">0</output></div>
    <div id="rate" class="rate" aria-label="Coins a minute"></div>
    <span class="grow"></span>
    <button id="cheat" class="icon wide" aria-label="Cheat: add 10,000 coins and 200 salvage">+10k</button>
    <button id="speed" class="icon wide" aria-label="Game speed" aria-pressed="false">×1</button>
    <button id="reset" class="icon" aria-label="Start over">↺</button>
  </header>
  <section class="tracks" aria-label="Gates and rewards">
    <div id="variety" class="track" title="Kinds of dish being served now / needed to open the next plot"><small>Variety</small><b></b><i><span></span></i></div>
    <div id="stars" class="track" title="Guests served"><small>Reputation</small><b></b><i><span></span></i></div>
    <div id="mastery" class="track" title="Dishes sent from kitchens"><small>Mastery</small><b></b><i><span></span></i></div>
  </section>
  <p id="flow" aria-live="polite"></p>
  <main>
    <canvas id="board" aria-label="The restaurant's plots on the pier"></canvas>
    <div id="banner" aria-live="polite"></div>
  </main>
  <footer class="dock">
    <div id="sel" class="sel"></div>
  </footer>
</div>
</body>
</html>
