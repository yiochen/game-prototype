<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#efe9dd">
<title>Sushi Loop · Kitchen line</title>
  <script type="module" crossorigin src="../../../../assets/sushi-loop/design/kitchen-line-preview-E7o804XF.js"></script>
  <link rel="modulepreload" crossorigin href="../../../../assets/modulepreload-polyfill-B5Qt9EMX.js">
  <link rel="stylesheet" crossorigin href="../../../../assets/kitchen-line-preview-CMog5KW5.css">
</head>
<body>
<div id="app">
  <header class="hud">
    <div class="coins" aria-label="Coins"><i class="coin"></i><output id="coins">0</output></div>
    <div class="goal">
      <div id="goalLabel"></div>
      <div class="bar" role="progressbar" aria-labelledby="goalLabel"><i id="goalFill"></i></div>
    </div>
    <button id="cheat" class="icon wide" aria-label="Cheat: add 10,000 coins">+10k</button>
    <button id="book" class="icon" aria-label="Recipe book">📖</button>
    <button id="reset" class="icon" aria-label="Start over">↺</button>
  </header>
  <nav class="rooms"><div id="serving" role="tablist" aria-label="Rooms: tap one to work in it"></div></nav>
  <p id="flow" aria-live="polite"></p>
  <p id="hint" aria-live="polite"></p>
  <main>
    <canvas id="board" aria-label="Kitchen floor"></canvas>
    <div id="banner" aria-live="polite"></div>
  </main>
  <footer class="dock">
    <div class="tools" role="toolbar" aria-label="Tools">
      <button data-tool="belt" aria-pressed="true"><svg viewBox="0 0 24 24"><path d="M7 5h10a3 3 0 0 1 3 3v8a3 3 0 0 1-3 3H7a3 3 0 0 1-3-3V8a3 3 0 0 1 3-3zm6-3 3 3-3 3"/></svg>Belt</button>
      <button data-tool="erase" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="m5 15 8-9 6 5-8 9H7zM9 20h11"/></svg>Erase</button>
      <button id="turn" disabled><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v5h-5"/></svg>Turn</button>
    </div>
    <div class="parts" id="parts" role="toolbar" aria-label="Machines"></div>
  </footer>
</div>
<dialog id="bookDlg" aria-label="Recipe book">
  <header><h2>Recipes</h2><button id="bookClose" aria-label="Close">✕</button></header>
  <p>A plate holds a set of ingredients, so the order they go on never matters. A process marks everything
  already on the plate, so the order a process runs in does. A room pays half again for the dish it asks for.</p>
  <ol id="bookList"></ol>
</dialog>
</body>
</html>
