<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#efe9dd">
<title>Sushi Loop · Loop requests</title>
  <script type="module" crossorigin src="../../../../assets/sushi-loop/design/loop-requests-preview-xzZ9ej-b.js"></script>
  <link rel="modulepreload" crossorigin href="../../../../assets/modulepreload-polyfill-B5Qt9EMX.js">
  <link rel="stylesheet" crossorigin href="../../../../assets/loop-requests-preview-Dnx1njjb.css">
</head>
<body>
<div id="app">
  <header class="hud">
    <div class="coins" aria-label="Coins"><i class="coin"></i><output id="coins">0</output></div>
    <div class="goal">
      <div id="goalLabel"></div>
      <div class="bar" role="progressbar" aria-labelledby="goalLabel"><i id="goalFill"></i></div>
    </div>
    <button id="sound" class="icon" aria-label="Sound" aria-pressed="true">♪</button>
    <button id="reset" class="icon" aria-label="Start over">↺</button>
  </header>
  <nav class="rooms">
    <div class="tabs" id="map" role="tablist" aria-label="Rooms"></div>
    <div id="reqs" aria-label="Requests"></div>
  </nav>
  <p id="hint" aria-live="polite"></p>
  <main>
    <canvas id="board" aria-label="Restaurant floor"></canvas>
    <div id="banner" aria-live="polite"></div>
  </main>
  <footer class="dock">
    <div class="tools" role="toolbar" aria-label="Tools">
      <button data-tool="belt" aria-pressed="true"><svg viewBox="0 0 24 24"><path d="M7 5h10a3 3 0 0 1 3 3v8a3 3 0 0 1-3 3H7a3 3 0 0 1-3-3V8a3 3 0 0 1 3-3zm6-3 3 3-3 3"/></svg>Belt</button>
      <button data-tool="stool" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M5 9h14M7 9l-2 11M17 9l2 11M8 15h8M6 9a6 3 0 0 1 12 0"/></svg>Stool<b id="stoolCount"></b></button>
      <button data-tool="chef" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M7 13a4 4 0 1 1 2-7 4 4 0 0 1 6 0 4 4 0 1 1 2 7v7H7z M7 17h10"/></svg>Chef<b id="chefCount"></b></button>
      <button data-tool="lane" aria-pressed="false" hidden><svg viewBox="0 0 24 24"><path d="M3 17c4-12 14-12 18 0M3 17v3m18-3v3M12 8v3"/></svg>Lane<b id="laneCount"></b></button>
      <button data-tool="erase" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="m5 15 8-9 6 5-8 9H7zM9 20h11"/></svg>Erase</button>
    </div>
    <div class="shop" aria-label="Shop">
      <button data-buy="chef" aria-label="Hire a chef">+ Chef<span></span></button>
      <button data-buy="lane" aria-label="Buy an express lane" hidden>+ Express lane<span></span></button>
    </div>
  </footer>
</div>
</body>
</html>
