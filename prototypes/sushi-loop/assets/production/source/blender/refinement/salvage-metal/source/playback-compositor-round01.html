<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:#ddd9d1;font:10px system-ui;color:#243443}header{height:26px;padding:6px;box-sizing:border-box}#stage{position:relative;width:777.6px;height:633.6px}#cells{display:grid;grid-template-columns:repeat(9,86.4px);grid-auto-rows:158.4px;position:absolute;inset:0}section{position:relative}span{position:absolute;top:0;left:2px;background:#ddd9d1dd;color:#243443;z-index:2;font-size:8px}canvas{position:absolute;image-rendering:auto}</style></head><body><header id="clock">Native family — all 9 clips × 4 facings</header><div id="stage"><div id="cells"></div><canvas id="native"></canvas></div>
<script type="module">
import {spriteFrame,groundRoot,orderPlacements} from './round-01-resources/consumer/sprite-layout.js';import {worldRasterPlan,paintWorldRaster} from './round-01-resources/consumer/world-sprite-raster.js';
const object=await(await fetch('../candidates/round-01/consumer-object.json')).json(),canvas=document.querySelector('canvas'),cells=document.querySelector('#cells'),items=[],images=[],colors=['#f8f6f0','#888e92','#172736'];
for(const clip of object.clips)for(const direction of ['N','E','S','W']){const index=items.length,col=index%9,row=Math.floor(index/9),cell=document.createElement('section');cell.style.background=colors[(row+col)%3];cell.innerHTML='<span>'+clip.id+' '+direction+'</span>';cells.append(cell);const im=new Image();im.src=new URL(clip.directions[direction].image,location.href);images.push(im);items.push({clip,direction,col,row});}
await Promise.all(images.map(im=>im.decode()));let last=-1,trace=[],start=0,playing=false,paintCount=0;
function draw(t){const sprites=items.map(item=>{const f=spriteFrame(object,item.clip,item.direction,t),p={id:item.clip.id+item.direction,object:object.id,x:0,y:0,direction:item.direction};const root=groundRoot(orderPlacements([p],[object])[0],object);return{x:item.col*192,y:item.row*352,width:192,height:352,rect:f.rect,root,clip:item.clip.id,direction:item.direction,phase:f.frame}});const plan=worldRasterPlan(sprites,[0,0,1728,1408]);paintWorldRaster(canvas,plan,images);if(!paintCount){canvas.style.left=plan.x*.45+'px';canvas.style.top=plan.y*.45+'px';canvas.style.width=plan.width/plan.scale*.45+'px';canvas.style.height=plan.height/plan.scale*.45+'px'}paintCount++;document.querySelector('#clock').textContent='Native family · '+t.toFixed(3)+'s · loops '+sprites[0].phase+' / collect '+sprites[8].phase;window.lastDraw={seconds:t,phase:sprites[0].phase,collectPhase:sprites[8].phase,canvas:[canvas.width,canvas.height],nearestAfterResize:canvas.getContext('2d').imageSmoothingEnabled===false,records:sprites};}
function raf(now){if(!playing)return;const t=(now-start)/1000,phase=Math.floor(t*12),before=performance.now();if(phase!==last){draw(t);last=phase}trace.push({now,elapsed:t,phase:phase%12,collectPhase:Math.min(11,phase),drawDuration:performance.now()-before});if(t<4)requestAnimationFrame(raf);else{playing=false;window.completed=trace;}}
draw(0);window.fixture={ready:true,play:()=>{trace=[];last=-1;start=performance.now();playing=true;window.completed=null;requestAnimationFrame(raf)},setTime:draw};
</script></body></html>
