<!doctype html><meta charset="utf-8"><title>Dock floor actual consumer evidence</title>
<style>*{box-sizing:border-box}html,body{margin:0;padding:0;font:12px system-ui;background:#bbb}.panel{display:inline-block;vertical-align:top}.label{height:24px;padding:3px;background:#ddd;color:#111}.stage{display:block;overflow:hidden}.stage svg{display:block}.row{display:flex;align-items:start}.stage image{image-rendering:auto}canvas{display:block;width:100%;height:100%}</style><div id="root"></div>
<script type="module">
import{orderPlacements,spriteFrame,clipFor,groundRoot}from'../resources/browser/sprite-layout.js';
import{worldRasterPlan,paintWorldRaster}from'../resources/browser/world-sprite-raster.js';
const inputs=await(await fetch('../resources/browser/inputs.json')).json();const objects=inputs.objects;const by=new Map(objects.map(o=>[o.id,o]));
const url=p=>new URL(p,location.href).href;const imgCache=new Map();async function image(u){if(imgCache.has(u))return imgCache.get(u);let i=new Image();i.src=u;await i.decode();imgCache.set(u,i);return i}
const NS='http://www.w3.org/2000/svg';function el(n,attrs={}){const o=document.createElementNS(NS,n);for(const[k,v]of Object.entries(attrs))o.setAttribute(k,v);return o}
function placement(a,p,d,anchor,phase=0,clip='static'){const o=by.get(a),r=o.directionRootCells?.[d]||o.rootCell||o.footprint.map(x=>x/2);const ang={N:Math.PI,E:Math.PI/2,S:0,W:-Math.PI/2}[d],x=Math.cos(ang)*p[0]-Math.sin(ang)*p[1],y=Math.sin(ang)*p[0]+Math.cos(ang)*p[1];return{object:a,direction:d,clip,x:anchor[0]/128+x-r[0],y:anchor[1]/128-y-r[1],offset:[phase,phase-89.6*p[2]]}}
function spritesFor(c){const d=c.direction,phase=c.phase||0,anchor=c.anchor||[288,352];let items=[];if(c.kind==='entryStandalone'){items=[placement('dock-entry',[0,0,0],d,anchor,phase)]}else if(c.kind==='entryRepeat'){for(let y=0;y<3;y++)for(let x=0;x<3;x++)items.push(placement('dock-entry',[0,0,0],d,[96+x*128,248+y*128],phase))}else if(c.kind==='repeat'){for(let y=0;y<2;y++)for(let x=0;x<2;x++)items.push(placement('dock-floor',[0,0,0],d,[224+x*384,256+y*384],phase));}else{items=[placement('dock-floor',[0,0,0],d,anchor,phase)];if(c.kind!=='standalone')items.push(placement('dock-entry',[0,-1.5,0],d,anchor,phase));if(c.kind==='family'){items.push(placement('workshop-hut',[.78,.35,.23],d,anchor,phase));items.push(placement('submarine-yellow',[-.70,-.42,.23],d,anchor,phase,'dock-ready'));if(c.cover)items.push(placement('dock-cover',[0,0,.23],d,anchor,phase,c.cover))}if(c.human){items.push(placement('customer-rosa',c.human,d,anchor,phase,'walk'))}}
 const ordered=orderPlacements(items,objects);let sprites=ordered.map(p=>{let o=by.get(p.object),f=spriteFrame(o,clipFor(o,p.clip),d,p.object==='dock-cover'&&p.clip==='uncover'?11/12:c.time||0),[x,y]=groundRoot(p,o);let path='../resources/browser/'+f.image;if(p.object==='dock-floor'&&!c.source)path='../../candidates/round-03/atlases/static-'+d+'.png';if(p.object==='dock-entry'&&!c.source)path='../resources/browser/paired-entry-'+d+'.png';return{url:url(path),rect:f.rect,x:x-f.root[0],y:y-f.root[1],width:f.frameSize[0],height:f.frameSize[1],object:p.object}});return{sprites,order:ordered.map(p=>p.object),placements:items}}
window.renderCases=async function(cases){document.querySelector('#root').replaceChildren();let records=[];for(const c of cases){const frame=c.frame||[576,640],bounds=c.bounds||[0,0,...frame],zoom=c.zoom||1;let panel=document.createElement('div');panel.className='panel';let label=document.createElement('div');label.className='label';label.textContent=c.label||JSON.stringify(c);panel.append(label);let stage=document.createElement('div');stage.className='stage';stage.style.width=bounds[2]*zoom+'px';stage.style.height=bounds[3]*zoom+'px';stage.style.background=c.background||'#a7a7a7';let svg=el('svg',{viewBox:bounds.join(' '),width:bounds[2]*zoom,height:bounds[3]*zoom});let sprites,record;if(c.native){sprites=[{url:url('../../candidates/round-03/native-pair-'+c.direction+'.png'),rect:[0,0,1152,1280],x:c.phase||0,y:c.phase||0,width:576,height:640}];record={order:['one-depth-tested-native-pair'],placements:[]}}else{record=spritesFor(c);sprites=record.sprites}let plan=worldRasterPlan(sprites,bounds),canvas=document.createElement('canvas');paintWorldRaster(canvas,plan,await Promise.all(sprites.map(s=>image(s.url))));let foreign=el('foreignObject',{x:plan.x,y:plan.y,width:plan.width/plan.scale,height:plan.height/plan.scale});foreign.append(canvas);svg.append(foreign);stage.append(svg);panel.append(stage);document.querySelector('#root').append(panel);records.push({...c,order:record.order,placements:record.placements,plan:{...plan,sprites:plan.sprites.map(s=>({...s,url:s.url.replace(location.origin,'')}))}})}window.lastRecords=records;await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));return records};window.ready=true;
</script>
