<!doctype html><meta charset="utf-8"><title>Eel round 01 current consumer verification</title>
<style>
body{margin:0;font:14px system-ui;color:#171b22;background:#d3d5d7}h1{font-size:17px;margin:12px}.grid{display:grid;grid-template-columns:repeat(4,224px);gap:0;width:max-content}.cell{width:224px;height:280px;overflow:hidden}.label{height:24px;padding-left:8px}.scene{position:relative;width:224px;height:256px;overflow:hidden}.logical .grid{grid-template-columns:repeat(4,448px)}.logical .cell{width:448px;height:536px}.logical .scene{width:448px;height:512px}.phone .grid{grid-template-columns:repeat(2,179.2px)}.phone .cell{width:179.2px;height:228.8px}.phone .scene{width:179.2px;height:204.8px}.playback .grid{grid-template-columns:repeat(2,224px)}svg{display:block;width:100%;height:100%}.marker{fill:none;stroke:#e90067;stroke-width:1}.socket{fill:#e90067}
</style><main id="root"></main>
<script type="module">
import {spriteFrame,groundRoot,attachmentMarkers,repeatedPlacements,sceneBounds,orderPlacements} from './resources/consumer/sprite-layout.js';
import {worldRasterPlan,paintWorldRaster} from './resources/consumer/world-sprite-raster.js';
const cat=await(await fetch('./nativeRecords/catalog-object.json')).json();
const images=new Map();for(const clip of cat.clips)for(const e of Object.values(clip.directions)){const url='./published/'+e.image;const image=new Image;image.src=url;await image.decode();images.set(url,image)}
const SVG='http://www.w3.org/2000/svg';let active=[];let panel='wave';window.timeline=[];let phaseWitnesses=[];
function digest(canvas){const c=canvas.getContext('2d'),{data,width,height}=c.getImageData(0,0,canvas.width,canvas.height);let h=2166136261,count=0,xsum=0,ysum=0,left=width,right=0,top=height,bottom=0;for(let i=0;i<data.length;i+=4){if(data[i+3]){const p=i/4,x=p%width,y=Math.floor(p/width);count++;xsum+=x;ysum+=y;left=Math.min(left,x);right=Math.max(right,x);top=Math.min(top,y);bottom=Math.max(bottom,y);h=Math.imul(h^i,16777619);for(let k=0;k<4;k++)h=Math.imul(h^data[i+k],16777619)}}return{visiblePositionRGBAFNV32:(h>>>0).toString(16),visiblePixels:count,alphaBBox:[left,top,right+1,bottom+1],alphaCentroid:[xsum/count,ysum/count]}}
function scene(clip,facing,seconds,bg,markers=false){const e=document.createElement('div');e.className='cell';e.style.background=bg;const label=document.createElement('div');label.className='label';label.textContent=clip.id+' '+facing;e.append(label);const box=document.createElement('div');box.className='scene';e.append(box);const svg=document.createElementNS(SVG,'svg');svg.setAttribute('viewBox','0 0 448 512');box.append(svg);const state={e,svg,clip,facing,seconds,markers};paint(state,seconds);active.push(state);return e}
function paint(state,seconds){const{svg,clip,facing,markers}=state,frame=spriteFrame(cat,clip,facing,seconds),root=groundRoot({x:0,y:0,direction:facing},cat,128),bounds=[root[0]-frame.root[0],root[1]-frame.root[1],...frame.frameSize],sprite={rect:frame.rect,x:bounds[0],y:bounds[1],width:frame.frameSize[0],height:frame.frameSize[1]},plan=worldRasterPlan([sprite],bounds);const canvas=state.canvas||document.createElement('canvas');paintWorldRaster(canvas,plan,[images.get('./published/'+frame.image)]);const fo=document.createElementNS(SVG,'foreignObject');fo.setAttribute('x',plan.x-bounds[0]);fo.setAttribute('y',plan.y-bounds[1]);fo.setAttribute('width',plan.width/plan.scale);fo.setAttribute('height',plan.height/plan.scale);canvas.style.cssText='display:block;width:100%;height:100%';fo.append(canvas);svg.replaceChildren(fo);state.canvas=canvas;state.frame=frame.frame;state.plan={...plan,sprites:[sprite]};
if(markers){for(const marker of attachmentMarkers(cat,clip,facing)){const c=document.createElementNS(SVG,'circle');c.setAttribute('cx',frame.root[0]+marker.position[0]);c.setAttribute('cy',frame.root[1]+marker.position[1]);c.setAttribute('r',2);c.setAttribute('class','socket');svg.append(c)}const p=document.createElementNS(SVG,'path');p.setAttribute('class','marker');p.setAttribute('d',`M ${frame.root[0]-8} ${frame.root[1]}h16 M ${frame.root[0]} ${frame.root[1]-8}v16`);svg.append(p)}
}
function repeated(root){const clip=cat.clips[0],placements=orderPlacements(repeatedPlacements(cat,'S','normal'),[cat]),bounds=sceneBounds(placements,[cat],128,[0,0]),sprites=placements.map(p=>{const f=spriteFrame(cat,clip,p.direction,.25),r=groundRoot(p,cat,128);return{rect:f.rect,x:r[0]-f.root[0],y:r[1]-f.root[1],width:f.frameSize[0],height:f.frameSize[1]}}),plan=worldRasterPlan(sprites,bounds),canvas=document.createElement('canvas');paintWorldRaster(canvas,plan,sprites.map(()=>images.get('./published/'+clip.directions.S.image)));const box=document.createElement('div');box.style.cssText=`width:${bounds[2]*.5}px;height:${bounds[3]*.5}px;background:#8e9196`;const svg=document.createElementNS(SVG,'svg');svg.setAttribute('viewBox',bounds.join(' '));const fo=document.createElementNS(SVG,'foreignObject');fo.setAttribute('x',plan.x);fo.setAttribute('y',plan.y);fo.setAttribute('width',plan.width/plan.scale);fo.setAttribute('height',plan.height/plan.scale);canvas.style.cssText='display:block;width:100%;height:100%';fo.append(canvas);svg.append(fo);box.append(svg);root.append(box);return{placements,bounds,plan,uniformCSSScale:.5,painterOrder:'unchanged orderPlacements'}}
const panels={wave:[['normal','S'],['swim','E'],['pursuit','N'],['restless','W']],turn:[['weave','S'],['dash','E'],['pause','N'],['aim','W']],reaction:[['hook','S'],['caught','E'],['escape','N'],['caught','W']]};
window.showStudy=(next='all',nextPanel='wave')=>{panel=nextPanel;active=[];phaseWitnesses=[];const root=document.querySelector('#root');root.className=next;root.replaceChildren();const title=document.createElement('h1');title.textContent='Native eel BODY round 01 · current consumer · '+next+(next==='playback'?' '+panel:'');root.append(title);if(next==='repeated')return repeated(root);let configs=[];
if(next==='all')configs=[{bg:'#8e9196',clips:cat.clips,facings:['N','E','S','W']}];
if(next==='logical'||next==='phone')configs=['#faf7ef','#8e9196','#151b25'].map(bg=>({bg,clips:[cat.clips[0]],facings:['N','E','S','W']}));
if(next==='attachments')configs=[{bg:'#faf7ef',clips:[cat.clips[0]],facings:['N','E','S','W'],markers:true}];
if(next==='playback')configs=panels[panel].map(([id,f])=>({bg:'#8e9196',clips:[cat.clips.find(c=>c.id===id)],facings:[f]}));
const grid=document.createElement('div');grid.className='grid';root.append(grid);for(const c of configs)for(const clip of c.clips)for(const f of c.facings)grid.append(scene(clip,f,clip.id==='normal'?.75:.5,c.bg,c.markers));return active.map(s=>({clip:s.clip.id,facing:s.facing,frame:s.frame,plan:s.plan}))};
window.setSeconds=seconds=>{for(const s of active)paint(s,seconds);return active.map(s=>({clip:s.clip.id,facing:s.facing,frame:s.frame,loop:s.clip.loop}))};
window.startPlayback=(duration=2.2)=>{window.timeline=[];phaseWitnesses=[];const seen=new Set,start=performance.now();return new Promise(resolve=>{function tick(now){const seconds=(now-start)/1000,frames=window.setSeconds(seconds);window.timeline.push({rafTime:now,seconds,frames});for(const s of active){const key=s.clip.id+'/'+s.facing+'/'+s.frame;if(!seen.has(key)){seen.add(key);phaseWitnesses.push({seconds,clip:s.clip.id,facing:s.facing,frame:s.frame,...digest(s.canvas)})}}if(seconds<duration)requestAnimationFrame(tick);else resolve({duration,actualElapsed:seconds,timeline:window.timeline,phaseWitnesses})}requestAnimationFrame(tick)})};
window.boundaryWitness=()=>[0,1/12,11/12,1,13/12,2].map(seconds=>({seconds,frames:window.setSeconds(seconds),digests:active.map(s=>({clip:s.clip.id,facing:s.facing,frame:s.frame,...digest(s.canvas)}))}));
window.showStudy();window.studyReady=true;
</script>
