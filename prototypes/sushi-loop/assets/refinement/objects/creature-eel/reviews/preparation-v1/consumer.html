<!doctype html><meta charset="utf-8"><title>Eel original current-consumer preparation</title>
<style>body{margin:0;font:14px system-ui;color:#171b22;background:#d3d5d7}h1{font-size:18px;margin:12px}h2{font-size:14px;margin:8px}.grid{display:grid;grid-template-columns:repeat(4,224px);gap:0;width:max-content}.cell{width:224px;height:276px;overflow:hidden}.label{height:20px;padding-left:8px}.scene{position:relative;width:224px;height:256px;overflow:hidden}.logical .grid{grid-template-columns:repeat(4,448px)}.logical .cell{width:448px;height:532px}.logical .scene{width:448px;height:512px}.phone .grid{grid-template-columns:repeat(2,179.2px)}.phone .cell{width:179.2px;height:224.8px}.phone .scene{width:179.2px;height:204.8px}svg{display:block;width:100%;height:100%}.marker{fill:none;stroke:#e90067;stroke-width:1}.socket{fill:#e90067}</style>
<main id="root"></main>
<script type="module">
import { spriteFrame,groundRoot,attachmentMarkers } from './resources/consumer/sprite-layout.js';
import { worldRasterPlan,paintWorldRaster } from './resources/consumer/world-sprite-raster.js';
const cat=await (await fetch('./resources/inputs/catalog-object.json')).json();
const images=new Map();for(const clip of cat.clips)for(const [f,e]of Object.entries(clip.directions)){const url='./resources/published/'+e.image;const image=new Image;image.src=url;await image.decode();images.set(url,image)}
const SVG='http://www.w3.org/2000/svg';const X='http://www.w3.org/1999/xhtml';let active=[];let mode='all';window.timeline=[];
function scene(clip,facing,seconds,bg,markers=false){const e=document.createElement('div');e.className='cell';e.style.background=bg;const label=document.createElement('div');label.className='label';label.textContent=clip.id+' '+facing;e.append(label);const box=document.createElement('div');box.className='scene';e.append(box);const svg=document.createElementNS(SVG,'svg');svg.setAttribute('viewBox','0 0 448 512');box.append(svg);const state={e,svg,clip,facing,seconds,markers};paint(state,seconds);active.push(state);return e}
function paint(state,seconds){const {svg,clip,facing,markers}=state;const frame=spriteFrame(cat,clip,facing,seconds);const root=groundRoot({x:0,y:0,direction:facing},cat,128);const bounds=[root[0]-frame.root[0],root[1]-frame.root[1],...frame.frameSize];const sprite={rect:frame.rect,x:bounds[0],y:bounds[1],width:frame.frameSize[0],height:frame.frameSize[1]};const plan=worldRasterPlan([sprite],bounds);const canvas=document.createElement('canvas');paintWorldRaster(canvas,plan,[images.get('./resources/published/'+frame.image)]);const fo=document.createElementNS(SVG,'foreignObject');fo.setAttribute('x',plan.x-bounds[0]);fo.setAttribute('y',plan.y-bounds[1]);fo.setAttribute('width',plan.width/plan.scale);fo.setAttribute('height',plan.height/plan.scale);canvas.style.cssText='display:block;width:100%;height:100%';fo.append(canvas);svg.replaceChildren(fo);state.frame=frame.frame;state.plan={...plan,sprites:[sprite]};
 if(markers){for(const marker of attachmentMarkers(cat,clip,facing)){const c=document.createElementNS(SVG,'circle');c.setAttribute('cx',frame.root[0]+marker.position[0]);c.setAttribute('cy',frame.root[1]+marker.position[1]);c.setAttribute('r',2);c.setAttribute('class','socket');svg.append(c)}const path=document.createElementNS(SVG,'path');path.setAttribute('class','marker');path.setAttribute('d',`M ${frame.root[0]-8} ${frame.root[1]}h16 M ${frame.root[0]} ${frame.root[1]-8}v16`);svg.append(path)}
}
window.showStudy=(next='all')=>{mode=next;active=[];const root=document.querySelector('#root');root.className=next;root.replaceChildren();const title=document.createElement('h1');title.textContent='Untouched published eel body · current consumer · '+next;root.append(title);let configs=[];
 if(next==='all') configs=[{bg:'#d3d5d7',clips:cat.clips,facings:['N','E','S','W']}];
 if(next==='logical')configs=['#faf7ef','#8e9196','#151b25'].map(bg=>({bg,clips:[cat.clips[0]],facings:['N','E','S','W']}));
 if(next==='phone')configs=['#faf7ef','#8e9196','#151b25'].map(bg=>({bg,clips:[cat.clips[0]],facings:['N','E','S','W']}));
 if(next==='attachments')configs=[{bg:'#faf7ef',clips:[cat.clips[0]],facings:['N','E','S','W'],markers:true}];
 if(next==='playback')configs=[{bg:'#8e9196',clips:[cat.clips[0]],facings:['S']},{bg:'#faf7ef',clips:[cat.clips.find(c=>c.id==='caught')],facings:['E']}];
 for(const c of configs){const grid=document.createElement('div');grid.className='grid';root.append(grid);for(const clip of c.clips)for(const f of c.facings)grid.append(scene(clip,f,clip.id==='normal'?.75:.5,c.bg,c.markers))}return active.map(s=>({clip:s.clip.id,facing:s.facing,frame:s.frame,plan:s.plan}))};
window.setSeconds=seconds=>{for(const s of active)paint(s,seconds);return active.map(s=>({clip:s.clip.id,facing:s.facing,frame:s.frame}))};
window.startPlayback=()=>{window.timeline=[];const start=performance.now();return new Promise(resolve=>{function tick(now){const seconds=(now-start)/1000;const frames=window.setSeconds(seconds);window.timeline.push({seconds,frames});if(seconds<2.2)requestAnimationFrame(tick);else resolve(window.timeline)}requestAnimationFrame(tick)})};
window.showStudy();window.studyReady=true;
</script>
