<!doctype html><meta charset="utf-8"><title>rock-half-width source-only consumer study</title><script type="importmap">{"imports":{"react":"/react-stub.js"}}</script><style>*{box-sizing:border-box}body{margin:12px;background:#dce3e2;color:#243341;font:12px system-ui}h1{font-size:15px;margin:0 0 8px}h2{font-size:12px;margin:12px 0 4px}.views{display:grid;grid-template-columns:repeat(4,1fr);gap:2px}canvas{display:block;background:#8aabb4;width:100%;height:auto}.row{margin:6px 0}.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}.label{margin:4px 0}.error{color:red}</style><h1>Source-only filter0.01 + whole-frame BOX study</h1><div>Shared native canvas; nearest composition then ordinary whole-canvas browser filtering.</div><div class="views" id="views"></div><h2>Finite W/E repeats, both source axes</h2><div class="two" id="joins"></div><h2>Parallel one-cell rows: measured ground gap 0.66 cell</h2><div id="clearance"></div><script type="module">
import {spriteFrame,clipFor,groundRoot,sceneBounds,orderPlacements} from '/resources/consumer/sprite-layout.js';
import {worldRasterPlan,paintWorldRaster} from '/resources/consumer/world-sprite-raster.js';
const object=await fetch('/resources/resource-inputs/catalog-object.json').then(r=>r.json());const records=[];
async function draw(label,placements,parent){
 const ordered=orderPlacements(placements,[object]),bounds=sceneBounds(ordered,[object],128,[3,3]);const sprites=ordered.map(p=>{const f=spriteFrame(object,clipFor(object,'static'),p.direction,0),r=groundRoot(p,object,128);return {x:r[0]-f.root[0],y:r[1]-f.root[1],width:f.frameSize[0],height:f.frameSize[1],rect:f.rect,url:`/evidence/source-filter-study/narrow-box-${p.direction}.png`,placement:p};});
 const loaded=await Promise.all(sprites.map(s=>new Promise((resolve,reject)=>{const im=new Image;im.onload=()=>resolve(im);im.onerror=reject;im.src=s.url})));const plan=worldRasterPlan(sprites,bounds);const row=document.createElement('div');row.className='row';const l=document.createElement('div');l.className='label';l.textContent=label;row.append(l);const canvas=document.createElement('canvas');row.append(canvas);parent.append(row);paintWorldRaster(canvas,plan,loaded);records.push({label,bounds,plan,smoothing:canvas.getContext('2d').imageSmoothingEnabled,data:canvas.toDataURL('image/png')});
}
for(const d of ['S','E'])await draw(d,[{object:object.id,x:1,y:1,direction:d}],document.querySelector('#views'));
for(const d of ['S','E'])await draw(`${d} exact one-cell W/E repeat`,[0,1,2].map(i=>({object:object.id,x:d==='S'?i:1,y:d==='S'?1:i,direction:d})),document.querySelector('#joins'));
await draw('Two parallel strips, one root-cell apart',[0,1].flatMap(y=>[0,1,2].map(x=>({object:object.id,x,y,direction:'S'}))),document.querySelector('#clearance'));
window.sourceStudy={records,ready:true};
</script>
