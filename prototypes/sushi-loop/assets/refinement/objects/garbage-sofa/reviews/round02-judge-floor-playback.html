<!doctype html><meta charset="utf-8"><title>Sofa judge registered floor playback</title><style>body{font:14px system-ui;background:#30343c;color:white;margin:12px}main{display:grid;grid-template-columns:448px 448px;gap:8px}canvas{width:448px;height:384px}#metrics{font-size:12px}</style><h1>Independent registered floor playback</h1><p>Exact sealed moving native frames; original cream floor and registered human. Full context at half-logical size; each sofa frame224×288. All4facings. 12fps, highlighted loops, clearance one shot with opaque native endpoint.</p><select id="clip"><option>highlighted</option><option>clearance</option></select> <button id="replay">Replay</button><p id="metrics">Loading</p><main></main><script>const dirs=['N','E','S','W'],imgs={},cvs={},all=[];for(const c of['highlighted','clearance']){imgs[c]={};for(const d of dirs){imgs[c][d]=[];for(let i=0;i<12;i++){const im=new Image();im.src='../candidates/round-02/frames/'+c+'-'+d+'/'+String(i).padStart(3,'0')+'.png';imgs[c][d].push(im);all.push(im)}}}const floor=new Image();floor.src='../source/resources/context-floor-cream.png';const human=new Image();human.src='../source/resources/context-chef-lena-S.png';all.push(floor,human);for(const d of dirs){const box=document.createElement('div');box.textContent=d;const cv=document.createElement('canvas');cv.width=448;cv.height=384;box.append(cv);document.querySelector('main').append(box);cvs[d]=cv}let start=0;document.querySelector('#replay').onclick=()=>start=performance.now();document.querySelector('#clip').onchange=()=>start=performance.now();Promise.all(all.map(im=>im.decode())).then(()=>{start=performance.now();requestAnimationFrame(tick)});function tick(now){const t=Math.max(0,Math.floor((now-start)*12/1000)),clip=document.querySelector('#clip').value,f=clip==='highlighted'?t%12:Math.min(11,t);for(const d of dirs){const ctx=cvs[d].getContext('2d');ctx.fillStyle='#30343c';ctx.fillRect(0,0,448,384);for(let y=0;y<3;y++)for(let x=0;x<5;x++)ctx.drawImage(floor,64+64*x,128+64*y,64,64);ctx.drawImage(imgs[clip][d][f],16,16,224,288);ctx.drawImage(human,240,36,96,160)}document.querySelector('#metrics').textContent=JSON.stringify({allDecoded:all.every(im=>im.complete&&im.naturalWidth),clip,fps:12,elapsedMs:Math.round(now-start),index:f,highlightedWraps:Math.floor(t/12),terminalHold:clip==='clearance'&&t>=12,sofaRootNative:[512,768],humanRootNative:[1152,640],pitchNative:256,sourceScale:2,contextScale:.25});requestAnimationFrame(tick)}</script>
