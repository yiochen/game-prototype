<!doctype html><meta charset="utf-8"><title>salvage-metal untouched source evidence</title>
<style>body{margin:0;background:#999;font-family:Arial,sans-serif}header{font-size:12px;padding:6px;height:24px;box-sizing:border-box}#grid{display:grid;grid-template-columns:repeat(4,192px);width:max-content}.slot{width:192px;height:376px;position:relative}.label{height:24px;font-size:12px;padding:4px;box-sizing:border-box;color:#111;background:#d6d6d6}canvas{position:absolute;left:0;top:24px;width:192px;height:352px;image-rendering:auto}.root{position:absolute;width:5px;height:5px;border:1px solid #f22;box-sizing:border-box;border-radius:50%;left:93.5px;top:269.5px;pointer-events:none}body.phone #grid{transform:scale(.45);transform-origin:top left}body.phone{width:346px;height:1547px;overflow:hidden}body.phone header{height:24px;width:346px}</style>
<header id="clock"></header><div id="grid"></div>
<script type="module">
import {worldRasterPlan,paintWorldRaster} from './resources/consumer/world-sprite-raster.js';
import {spriteFrame,groundRoot,orderPlacements} from './resources/consumer/sprite-layout.js';
const object=await (await fetch('./resources/object/inputs/catalog-object.json')).json();
const directions=['N','E','S','W'],images=new Map(),slots=[];window.drawLog=[];
for(const clip of object.clips)for(const direction of directions){const url='./resources/consumer/'+clip.directions[direction].image;if(!images.has(url)){const im=new Image();im.src=url;await im.decode();images.set(url,im)}
const el=document.createElement('div');el.className='slot';const palette=['#f8f8f5','#888888','#18232e'];el.style.background=palette[(object.clips.indexOf(clip)+directions.indexOf(direction))%3];el.innerHTML=`<div class="label">${clip.id} · ${direction}</div><canvas></canvas><i class="root"></i>`;document.querySelector('#grid').append(el);slots.push({el,canvas:el.querySelector('canvas'),clip,direction,url});}
window.seek=(seconds,record=true)=>{window.currentTime=seconds;document.querySelector('#clock').textContent=`Untouched source · ${seconds.toFixed(4)}s · 12 fps · full logical frames; red mark = registered ground root`;
const records=[];for(const slot of slots){const frame=spriteFrame(object,slot.clip,slot.direction,seconds);const placement=orderPlacements([{object:object.id,x:0,y:0,direction:slot.direction,clip:slot.clip.id}],[object])[0];const root=groundRoot(placement,object);const sprite={url:slot.url,rect:frame.rect,x:root[0]-frame.root[0],y:root[1]-frame.root[1],width:frame.frameSize[0],height:frame.frameSize[1]};const bounds=[sprite.x,sprite.y,sprite.width,sprite.height],plan=worldRasterPlan([sprite],bounds);paintWorldRaster(slot.canvas,plan,[images.get(slot.url)]);slot.canvas.style.left=(plan.x-sprite.x)+'px';slot.canvas.style.top=(24+plan.y-sprite.y)+'px';slot.canvas.style.width=(plan.width/plan.scale)+'px';slot.canvas.style.height=(plan.height/plan.scale)+'px';records.push({clip:slot.clip.id,direction:slot.direction,frame:frame.frame,rect:frame.rect,groundRoot:root,plan:{x:plan.x,y:plan.y,width:plan.width,height:plan.height,scale:plan.scale}})}if(record)window.drawLog.push({seconds,records});return records;};
let running=false,start=0;function tick(now){if(!running)return;window.seek((now-start)/1000);requestAnimationFrame(tick)}window.play=()=>{window.drawLog=[];running=true;start=performance.now();requestAnimationFrame(tick)};window.pause=()=>running=false;window.setSize=phone=>{document.body.classList.toggle('phone',phone);};window.seek(0);window.fixtureReady=true;
</script>
