<!doctype html><meta charset="utf-8"><title>Shelving four-facing motion overview</title><style>body{margin:20px;background:#1b2229;color:#eae7db;font:14px system-ui}header{position:sticky;top:0;background:#1b2229;padding:6px;z-index:1}button,select{font:inherit;margin:3px}.grid{display:grid;grid-template-columns:repeat(2, max-content);gap:12px}.pair{display:flex;gap:4px}canvas{width:192.5px;height:288.75px}article{border:1px solid #51606b;padding:7px}h3{margin:4px}a{color:#9de6ff}</style><header><b>Four-facing8-stream native motion · exact55CSSpx per cell ·12fps</b><br>Each pair: source|candidate. Highlighted loops; clearance plays once and holds opaque fragments.<br><button id="restart">Restart all</button><button id="pause">Pause/play</button><select id="bg"><option value="#767676">Gray</option><option value="#ebe7db">Light</option><option value="#1b2229">Dark</option></select><select id="scale"><option value="0.21484375">55pxcell</option><option value="0.25">Half224x336</option><option value="0.5">Logical448x672</option><option value="1">Native896x1344</option></select><a href="playback.html">Expanded three-size comparison</a></header><main></main><script>const all=[];let start=performance.now(),paused=false,pausedAt=0;let background=document.querySelector('#bg'),scale=document.querySelector('#scale');for(let clip of ['highlighted','clearance']){let h=document.createElement('h2');h.textContent=clip;document.querySelector('main').append(h);let grid=document.createElement('div');grid.className='grid';document.querySelector('main').append(grid);for(let d of ['S','E','N','W']){let ar=document.createElement('article');ar.innerHTML=`<h3>${d}<span></span></h3><div class="pair"></div>`;grid.append(ar);let g={clip,d,ar,imgs:[[],[]],cv:[]};for(let j=0;j<2;j++){let cv=document.createElement('canvas');cv.width=896;cv.height=1344;ar.lastChild.append(cv);g.cv.push(cv);for(let i=0;i<12;i++){let im=new Image;im.src=j===0?`original-comparison/${clip}-${d}/${String(i).padStart(3,'0')}.png`:`../frames/${clip}-${d}/${String(i).padStart(3,'0')}.png`;g.imgs[j].push(im)}}all.push(g)}}document.querySelector('#restart').onclick=()=>{start=performance.now();if(paused)pausedAt=start};document.querySelector('#pause').onclick=()=>{paused=!paused;if(paused)pausedAt=performance.now();else start+=performance.now()-pausedAt};scale.onchange=()=>document.querySelectorAll('canvas').forEach(cv=>{cv.style.width=896*Number(scale.value)+'px';cv.style.height=1344*Number(scale.value)+'px'});function tick(now){let f=Math.max(0,Math.floor(((paused?pausedAt:now)-start)*12/1000));for(let g of all){let i=g.clip==='highlighted'?f%12:Math.min(f,11);g.ar.querySelector('span').textContent=` frame${i+1}/12 ${g.clip==='highlighted'?'wrap'+Math.floor(f/12):f>11?'terminal hold':''}`;for(let j=0;j<2;j++){let ct=g.cv[j].getContext('2d');ct.fillStyle=background.value;ct.fillRect(0,0,896,1344);if(g.imgs[j][i]?.complete)ct.drawImage(g.imgs[j][i],0,0)}}requestAnimationFrame(tick)}requestAnimationFrame(tick);</script>
