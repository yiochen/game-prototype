<!doctype html><meta charset="utf-8"><title>garbage-shelving native12fps comparison</title><style>body{background:#1b2229;color:#ece7db;font:14px system-ui;margin:20px}button,select{font:inherit;margin:4px}section{margin:22px 0;border-top:1px solid #52606a;padding:12px;overflow:auto}.views{display:flex;gap:8px;align-items:flex-end}figure{margin:0}figcaption{padding:5px}.stage{display:flex;align-items:flex-end;gap:5px}canvas{background:#767676}input{width:220px}header{position:sticky;top:0;background:#1b2229;padding:10px;z-index:2}</style><header><b>Native12fps: source/candidate synchronized whole-frame comparison.</b><br>Highlighted plays at least3wraps; clearance runs once and holds opaque terminal fragments. Restart is explicit. Camera and registration never fit. Consumer uses exactly55CSSpx per cell.<br><button id="restart">Restart all</button><button id="toggle">Pause/play</button><select id="bg"><option value="#767676">Middle gray</option><option value="#ebe7db">Light</option><option value="#1b2229">Dark</option></select></header><main></main><script>const dirs=['S','E','N','W'],clips=['highlighted','clearance'];let start=performance.now(),pause=false,frozen=0;const groups=[];const bg=document.querySelector('#bg');function make(c,d){let sec=document.createElement('section');sec.innerHTML=`<h3>${c}-${d} ·12fps ${c==='highlighted'?'loop;3wraps minimum':'one shot with final hold'}</h3><button class="restart">Restart this</button><input type="range" min="0" max="11" step="1" value="0"><span></span><div class="views"></div>`;document.querySelector('main').append(sec);let g={c,d,start:performance.now(),images:[[],[]],canvases:[],manual:null};for(let j=0;j<2;j++){for(let i=0;i<12;i++){let im=new Image;im.src=j===0?`original-comparison/${c}-${d}/${String(i).padStart(3,'0')}.png`:`../frames/${c}-${d}/${String(i).padStart(3,'0')}.png`;g.images[j].push(im)}}for(let [name,w,h] of [['Logical',448,672],['Half',224,336],['Consumer55pxcell',192.5,288.75]]){let f=document.createElement('figure');f.innerHTML=`<figcaption>${name}: original | candidate</figcaption><div class="stage"></div>`;for(let j=0;j<2;j++){let cv=document.createElement('canvas');cv.width=896;cv.height=1344;cv.style.width=w+'px';cv.style.height=h+'px';f.lastChild.append(cv);g.canvases.push([cv,j])}sec.querySelector('.views').append(f)}g.sec=sec;sec.querySelector('.restart').onclick=()=>{g.start=performance.now();g.manual=null};sec.querySelector('input').oninput=e=>g.manual=Number(e.target.value);groups.push(g)}for(let c of clips)for(let d of dirs)make(c,d);document.querySelector('#restart').onclick=()=>groups.forEach(g=>{g.start=performance.now();g.manual=null});document.querySelector('#toggle').onclick=()=>{pause=!pause;if(pause)frozen=performance.now();else{let dt=performance.now()-frozen;groups.forEach(g=>g.start+=dt)}};function tick(now){for(let g of groups){let raw=Math.floor(((pause?frozen:now)-g.start)*12/1000),i=g.manual??(g.c==='highlighted'?raw%12:Math.min(11,raw));g.sec.querySelector('span').textContent=` frame${i+1}/12 · ${g.c==='highlighted'?'wrap'+Math.floor(raw/12):raw>11?'terminal fragments held':''}`;g.sec.querySelector('input').value=i;for(let[cv,j]of g.canvases){let ct=cv.getContext('2d');ct.fillStyle=bg.value;ct.fillRect(0,0,896,1344);if(g.images[j][i]?.complete)ct.drawImage(g.images[j][i],0,0)}}requestAnimationFrame(tick)}requestAnimationFrame(tick);</script>
