<!doctype html><meta charset="utf-8"><title>Samir independent context MP4 review</title><style>body{font:14px system-ui;background:#6e6e6e;color:white;margin:8px}header{position:sticky;top:0;background:#333;padding:7px;z-index:2}button{margin:0 8px}section{display:grid;grid-template-columns:repeat(4,192px);gap:6px;margin:12px 0}h2{grid-column:1/-1;margin:0;font-size:16px}video{width:192px;height:352px}figure{margin:0}figcaption{height:20px}</style><header><strong>Exact submitted MP4 files · 12fps · logical192×352 registered context</strong><button id="prev">Previous</button><button id="next">Next</button><button id="replay">Replay visible clips</button><span id="page"></span></header><main></main><script>
const states=['seated-wait','eat','eat-salmon','seated-wait-empty'];let page=0;const base='../../candidates/round-01/';const oneShot=new Set(['sit-down','stand-up','happy']);function draw(){document.querySelector('#page').textContent=`Page ${page+1}/2`;document.querySelector('main').innerHTML=states.slice(page*2,page*2+2).map(s=>`<section><h2>${s} · ${oneShot.has(s)?'source one-shot':'source loop'}</h2>${['S','E','N','W'].map(d=>`<figure><figcaption>${s} ${d}</figcaption><video controls muted autoplay playsinline ${oneShot.has(s)?'':'loop'} src="${base}contexts/${s}-${d}.mp4"></video></figure>`).join('')}</section>`).join('')}document.querySelector('#prev').onclick=()=>{page=(page+1)%2;draw()};document.querySelector('#next').onclick=()=>{page=(page+1)%2;draw()};document.querySelector('#replay').onclick=()=>{for(const v of document.querySelectorAll('video')){v.currentTime=0;v.play()}};draw();
</script>
