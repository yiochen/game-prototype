<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;font:13px system-ui;background:#808080;color:#fff}h1{font-size:17px;margin:12px}h2{font-size:14px;margin:8px}.row{display:flex;gap:8px;margin:8px;align-items:flex-start}.cell{border:1px solid #a0a0a0}.label{height:22px;text-align:center}.stage{position:relative;overflow:hidden}.stage canvas{position:absolute}#status{padding:6px 12px}
</style></head><body><h1>Portal rim · round01 saved native candidate → current world consumer</h1><div id="status"></div><h2>Logical ×1</h2><div class="row" id="logical"></div><h2>Phone ×0.55</h2><div class="row" id="phone"></div><script type="module">
import {worldRasterPlan,paintWorldRaster} from '../../source/round-01-resources/consumer/world-sprite-raster.js';
import {spriteFrame,groundRoot,orderPlacements} from '../../source/round-01-resources/consumer/sprite-layout.js';
const catalog=await (await fetch('../../source/round-01-resources/inputs/catalog-object.json')).json();
const images={};for(const dir of ['N','E','S','W']){const img=new Image();img.src=`./published/idle-${dir}.png`;await img.decode();images[dir]=img;}
const stages=[];for(const [id,scale] of [['logical',1],['phone',.55]])for(const direction of ['N','E','S','W']){const cell=document.createElement('div');cell.className='cell';cell.innerHTML=`<div class="label">${direction} · ${id}</div><div class="stage"><canvas></canvas></div>`;const stage=cell.querySelector('.stage');stage.style.width=`${192*scale}px`;stage.style.height=`${384*scale}px`;document.getElementById(id).append(cell);stages.push({direction,scale,canvas:cell.querySelector('canvas')});}
window.drawAt=seconds=>{const records=[];for(const item of stages){const p=orderPlacements([{object:catalog.id,x:0,y:0,direction:item.direction}], [catalog])[0];const f=spriteFrame(catalog,catalog.clips[0],item.direction,seconds);const g=groundRoot(p,catalog,128);const sprite={x:g[0]-f.root[0],y:g[1]-f.root[1],width:f.frameSize[0],height:f.frameSize[1],rect:f.rect,url:images[item.direction].src};const bounds=[sprite.x,sprite.y,192,384];const plan=worldRasterPlan([sprite],bounds);paintWorldRaster(item.canvas,plan,[images[item.direction]]);Object.assign(item.canvas.style,{left:`${(plan.x-bounds[0])*item.scale}px`,top:`${(plan.y-bounds[1])*item.scale}px`,width:`${plan.width/plan.scale*item.scale}px`,height:`${plan.height/plan.scale*item.scale}px`});records.push({direction:item.direction,displayScale:item.scale,frame:f.frame,rect:f.rect,groundRoot:g,sprite,plan:{x:plan.x,y:plan.y,width:plan.width,height:plan.height,scale:plan.scale},canvasRGBA: item.canvas.toDataURL()});}document.querySelector('#status').textContent=`time ${seconds.toFixed(6)} · frame ${records[0].frame} · 12 fps / 12-frame loop`;window.lastRecords=records;return records;};
window.setBG=color=>{document.body.style.background=color;document.body.style.color=color==='#eeeeee'?'#222':'#fff';};
window.playback=[];window.play=()=>new Promise(resolve=>{const start=performance.now();let last=-1;function step(now){const seconds=(now-start)/1000;const frame=Math.floor(seconds*12);if(frame!==last){window.drawAt(seconds);window.playback.push({elapsedMs:now-start,rawFrame:frame,frame:window.lastRecords[0].frame});last=frame;}if(seconds<2.2)requestAnimationFrame(step);else {window.playbackTiming={startPerformanceMs:start,endPerformanceMs:now,durationMs:now-start,minimumRequestedMs:2200};resolve(window.playback);}}requestAnimationFrame(step);});
window.drawAt(10/12);window.ready=true;
</script></body></html>
